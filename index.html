<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My 3D Portfolio Room</title>
    <style> 
        body {
            margin: 0;
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: #fff;
        } 

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }

        p.instructions {
            margin-top: 5px;
            font-size: 1rem;
            color: #ccc;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        #info-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            padding: 20px 30px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            max-width: 400px;
        }

        #info-panel.visible {
            opacity: 1;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.9);
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            display: none;
            text-shadow: 0 0 5px #000;
        }

        #item-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 15, 0.95);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #ff4757;
            color: white;
            z-index: 30;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.4);
            max-width: 500px;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }

        #item-modal.active {
            display: block;
        }

        #item-modal h2 {
            margin-top: 0;
            color: #ff4757;
            font-size: 2rem;
        }

        #item-modal p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        #modal-close {
            padding: 10px 25px;
            background: #ff4757;
            border: none;
            color: #111;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.2s;
        }

        #modal-close:hover {
            background: #ff6b81;
        }

        #modal-link {
            padding: 10px 25px;
            background: #1e90ff;
            border: none;
            color: #111;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.2s;
            text-decoration: none;
            display: none; /* Hidden by default */
        }

        #modal-link:hover {
            background: #70a1ff;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            letter-spacing: 2px;
            z-index: 20;
            transition: opacity 0.5s ease;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="loading">Loading Portfolio Room...</div>
    <div id="crosshair">+</div>

    <div id="item-modal">
        <h2 id="modal-title">Title</h2>
        <img id="modal-img" src="" alt="Certificate" style="display: none; max-width: 100%; max-height: 300px; margin: 0 auto 20px auto; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);">
        <p id="modal-desc">Description goes here.</p>
        <div style="display: flex; justify-content: center; gap: 15px;">
            <a id="modal-link" href="#" target="_blank">View Prototype</a>
            <button id="modal-close">Close</button>
        </div>
    </div>

    <div id="ui-container">
        <h1>PORTFOLIO ROOM</h1>
        <p class="instructions">Click anywhere to start.<br>W, A, S, D to move. SHIFT to sprint. SPACE to jump.<br>Click on items to view details.</p>
    </div>

    <div id="info-panel">
        <h2 id="info-title">Project Title</h2>
        <p id="info-desc">Description of the project goes here.</p>
    </div>

    <div id="canvas-container"></div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.Fog(0x0a0a0a, 10, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(14, 3.5, -16); // Increased height from 2.5 to 3.5
        camera.lookAt(0, 3.5, 0); // Face towards the center of the room at the new height

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        let controls;
        const initControls = () => {
            controls = new THREE.PointerLockControls(camera, document.body);

            const instructions = document.querySelector('.instructions');
            
            document.body.addEventListener('click', function () {
                if (!document.getElementById('item-modal').classList.contains('active')) {
                    controls.lock();
                }
            });

            controls.addEventListener('lock', function () {
                instructions.innerHTML = "W, A, S, D to move. SHIFT to sprint. SPACE to jump.<br>Click on items for details.<br>Press ESC to unlock.";
                document.getElementById('crosshair').style.display = 'block';
            });

            controls.addEventListener('unlock', function () {
                instructions.innerHTML = "Click anywhere to resume.<br>W, A, S, D to move. SPACE to jump.<br>Click on items for details.";
                hideInfo();
                document.getElementById('crosshair').style.display = 'none';
            });

            scene.add(controls.getObject());
        };

        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let isRunning = false;
        let canJump = false;

        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const speed = 40.0;
        const jumpVelocity = 8.0;
        const gravity = 30.0;
        let prevTime = performance.now();

        const onKeyDown = function (event) {
            switch (event.code) {
                case 'ArrowUp':
                case 'KeyW': moveForward = true; break;
                case 'ArrowLeft':
                case 'KeyA': moveLeft = true; break;
                case 'ArrowDown':
                case 'KeyS': moveBackward = true; break;
                case 'ArrowRight':
                case 'KeyD': moveRight = true; break;
                case 'ShiftLeft':
                case 'ShiftRight': isRunning = true; break;
                case 'Space':
                    if (canJump === true) {
                        velocity.y = jumpVelocity;
                        canJump = false;
                    }
                    break;
            }
        };

        const onKeyUp = function (event) {
            switch (event.code) {
                case 'ArrowUp':
                case 'KeyW': moveForward = false; break;
                case 'ArrowLeft':
                case 'KeyA': moveLeft = false; break;
                case 'ArrowDown':
                case 'KeyS': moveBackward = false; break;
                case 'ArrowRight':
                case 'KeyD': moveRight = false; break;
                case 'ShiftLeft':
                case 'ShiftRight': isRunning = false; break;
            }
        };

        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        // Premium Hemisphere Light for rich ambient blending (cool ceiling, dark warm floor)
        const hemiLight = new THREE.HemisphereLight(0x445577, 0x111122, 0.8);
        scene.add(hemiLight);

        // Main Point Light - softer, slightly warm for a premium gallery feel
        const mainLight = new THREE.PointLight(0xfff4e6, 1.2, 150);
        mainLight.position.set(0, 7.5, 0); // Pushed up near the ceiling
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.bias = -0.0005; // Smooth out shadow acne for a cleaner look
        scene.add(mainLight);

        // Premium overhead architectural light fixture (Sleek Halo Chandelier)
        const fixtureGroup = new THREE.Group();
        fixtureGroup.position.set(0, 7.5, 0);

        // Inner glowing ring
        const haloGeom = new THREE.TorusGeometry(3.5, 0.05, 16, 128);
        const haloMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const halo = new THREE.Mesh(haloGeom, haloMat);
        halo.rotation.x = Math.PI / 2;
        fixtureGroup.add(halo);

        // Outer dark brushed metal housing
        const housingGeom = new THREE.TorusGeometry(3.6, 0.1, 16, 128);
        const housingMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.2 });
        const housing = new THREE.Mesh(housingGeom, housingMat);
        housing.rotation.x = Math.PI / 2;
        housing.position.y = 0.05;
        fixtureGroup.add(housing);
        
        // Connecting rods to the ceiling
        const rodGeom = new THREE.CylinderGeometry(0.03, 0.03, 0.5);
        const rodMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.2 });
        for(let i = 0; i < 4; i++) {
            const rod = new THREE.Mesh(rodGeom, rodMat);
            const angle = (i / 4) * Math.PI * 2 + (Math.PI/4); // offset by 45 degrees
            rod.position.set(Math.cos(angle) * 3.6, 0.25, Math.sin(angle) * 3.6);
            fixtureGroup.add(rod);
        }

        scene.add(fixtureGroup);

        const roomWidth = 40;
        const roomDepth = 40;
        const wallHeight = 8;
        const halfWidth = roomWidth / 2;
        const halfDepth = roomDepth / 2;

        const interactables = [];
        const dynamicObjects = [];
        const floatingDisplays = [];
        const raycaster = new THREE.Raycaster();
        const centerScreen = new THREE.Vector2(0, 0);

        const floorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x3742fa,
            roughness: 0.2,
            metalness: 0.5
        });

        const ceilingMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xffffff,
            roughness: 0.8,
            metalness: 0.1
        });

        const floorGeometry = new THREE.PlaneGeometry(roomWidth, roomDepth);
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const ceilingGeometry = new THREE.PlaneGeometry(roomWidth, roomDepth);
        const ceiling = new THREE.Mesh(ceilingGeometry, ceilingMaterial);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = wallHeight;
        scene.add(ceiling);

        const walls = new THREE.Group();
        scene.add(walls);

        const cyberMuralSvg1 = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" fill="none">
            <path d="M100 256 L300 150 L500 350 L700 150 L900 256" stroke="white" stroke-width="3" stroke-dasharray="10,10"/>
            <circle cx="100" cy="256" r="18" fill="#111" stroke="#ff4757" stroke-width="6"/>
            <circle cx="300" cy="150" r="24" fill="#111" stroke="#1e90ff" stroke-width="8"/>
            <circle cx="500" cy="350" r="30" fill="#111" stroke="#2ed573" stroke-width="10"/>
            <circle cx="700" cy="150" r="24" fill="#111" stroke="#ffa502" stroke-width="8"/>
            <circle cx="900" cy="256" r="18" fill="#111" stroke="#ff4757" stroke-width="6"/>
            <path d="M300 150 L300 280 M500 350 L500 150 M700 150 L700 300" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
            <rect x="260" y="280" width="80" height="30" rx="8" fill="rgba(30,144,255,0.2)" stroke="#1e90ff" stroke-width="2"/>
            <rect x="660" y="300" width="80" height="30" rx="8" fill="rgba(255,165,2,0.2)" stroke="#ffa502" stroke-width="2"/>
            <path d="M50 50 L150 50 M50 50 L50 150" stroke="white" stroke-width="3"/>
            <path d="M974 50 L874 50 M974 50 L974 150" stroke="white" stroke-width="3"/>
        </svg>
        `;

        const cyberMuralSvg2 = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" fill="none">
            <g transform="translate(100, 50)">
                <circle cx="200" cy="200" r="150" stroke="white" stroke-width="2" stroke-dasharray="5,15"/>
                <circle cx="200" cy="200" r="100" stroke="white" stroke-width="4"/>
                <circle cx="200" cy="200" r="50" stroke="white" stroke-width="1" stroke-dasharray="2,2"/>
                <line x1="200" y1="20" x2="200" y2="380" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
                <line x1="20" y1="200" x2="380" y2="200" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
                <circle cx="200" cy="50" r="10" fill="#2ed573"/>
                <circle cx="350" cy="200" r="10" fill="#1e90ff"/>
                <circle cx="200" cy="350" r="10" fill="#ff4757"/>
            </g>
            <g transform="translate(600, 100)">
                <rect x="0" y="0" width="250" height="150" rx="15" stroke="white" stroke-width="3" fill="rgba(255,255,255,0.05)"/>
                <line x1="30" y1="50" x2="220" y2="50" stroke="white" stroke-width="2"/>
                <line x1="30" y1="90" x2="180" y2="90" stroke="white" stroke-width="2"/>
                <line x1="30" y1="110" x2="140" y2="110" stroke="white" stroke-width="2"/>
            </g>
        </svg>
        `;

        const cyberMuralSvg3 = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" fill="none">
            <g opacity="0.6">
                <circle cx="512" cy="256" r="180" stroke="currentColor" stroke-width="3" stroke-dasharray="10, 15"/>
                <circle cx="512" cy="256" r="140" stroke="currentColor" stroke-width="1" opacity="0.5"/>
                <circle cx="512" cy="256" r="100" stroke="currentColor" stroke-width="4" stroke-dasharray="40, 20"/>
                <path d="M312 256 L100 256 M712 256 L924 256 M512 56 L512 100 M512 412 L512 456" stroke="currentColor" stroke-width="2"/>
                <circle cx="512" cy="256" r="30" fill="currentColor" opacity="0.2"/>
                <circle cx="512" cy="256" r="10" fill="currentColor"/>
                <rect x="200" y="100" width="40" height="40" rx="5" stroke="currentColor" stroke-width="2"/>
                <rect x="784" y="372" width="40" height="40" rx="5" stroke="currentColor" stroke-width="2"/>
                <path d="M 220 140 L 220 256" stroke="currentColor" stroke-width="1" stroke-dasharray="5,5"/>
                <path d="M 804 256 L 804 372" stroke="currentColor" stroke-width="1" stroke-dasharray="5,5"/>
            </g>
        </svg>
        `;

        const cyberMuralSvg4 = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" fill="none">
            <g opacity="0.5">
                <path d="M -100 256 C 200 56, 400 456, 1124 256" stroke="currentColor" stroke-width="4" fill="none"/>
                <path d="M -100 256 C 300 156, 500 356, 1124 256" stroke="currentColor" stroke-width="2" fill="none" stroke-dasharray="10, 10"/>
                <path d="M -100 256 C 400 256, 600 256, 1124 256" stroke="currentColor" stroke-width="1" fill="none" opacity="0.5"/>
                <circle cx="218" cy="214" r="8" fill="currentColor"/>
                <circle cx="512" cy="256" r="12" fill="none" stroke="currentColor" stroke-width="3"/>
                <circle cx="512" cy="256" r="4" fill="currentColor"/>
                <circle cx="806" cy="298" r="8" fill="currentColor"/>
                <circle cx="218" cy="214" r="25" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3,3"/>
                <circle cx="806" cy="298" r="25" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3,3"/>
                <path d="M 218 214 L 218 100 L 300 100" stroke="currentColor" stroke-width="2" fill="none"/>
                <path d="M 806 298 L 806 412 L 724 412" stroke="currentColor" stroke-width="2" fill="none"/>
                <rect x="300" y="85" width="80" height="30" rx="4" stroke="currentColor" stroke-width="2"/>
                <rect x="644" y="397" width="80" height="30" rx="4" stroke="currentColor" stroke-width="2"/>
            </g>
        </svg>
        `;

        const cyberMuralSvg5 = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" fill="none">
            <g opacity="0.4">
                <polygon points="50,256 100,100 300,100 350,256 300,412 100,412" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="20,10"/>
                <polygon points="674,256 724,100 924,100 974,256 924,412 724,412" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="20,10"/>
                <line x1="350" y1="256" x2="674" y2="256" stroke="currentColor" stroke-width="2" stroke-dasharray="5,5"/>
                <circle cx="200" cy="256" r="50" stroke="currentColor" stroke-width="2"/>
                <circle cx="824" cy="256" r="50" stroke="currentColor" stroke-width="2"/>
                <circle cx="200" cy="256" r="20" fill="currentColor"/>
                <circle cx="824" cy="256" r="20" fill="currentColor"/>
            </g>
        </svg>
        `;

        function createWallDecal(svgString, color, position, rotation, width, height) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            const img = new Image();
            const coloredSvg = svgString.replace(/white/g, '#ffffff').replace(/currentColor/g, color);
            const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(coloredSvg);
            
            const texture = new THREE.CanvasTexture(canvas);
            img.onload = () => {
                ctx.shadowColor = color;
                ctx.shadowBlur = 30;
                ctx.drawImage(img, 0, 0, 1024, 512);
                texture.needsUpdate = true;
            };
            img.src = svgUrl;

            const geom = new THREE.PlaneGeometry(width, height);
            const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide, depthWrite: false });
            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.copy(position);
            mesh.rotation.copy(rotation);
            scene.add(mesh);
        }

        createWallDecal(cyberMuralSvg1, "#1e90ff", new THREE.Vector3(halfWidth - 0.08, 3.5, -12), new THREE.Euler(0, -Math.PI/2, 0), 8, 4);
        createWallDecal(cyberMuralSvg2, "#2ed573", new THREE.Vector3(halfWidth - 0.08, 3.5, 12), new THREE.Euler(0, -Math.PI/2, 0), 8, 4);
        createWallDecal(cyberMuralSvg1, "#ff4757", new THREE.Vector3(-halfWidth + 0.08, 3.5, -12), new THREE.Euler(0, Math.PI/2, 0), 8, 4);
        createWallDecal(cyberMuralSvg2, "#ffa502", new THREE.Vector3(-halfWidth + 0.08, 3.5, 12), new THREE.Euler(0, Math.PI/2, 0), 8, 4);

        createWallDecal(cyberMuralSvg4, "#00cec9", new THREE.Vector3(-4, 3.5, -halfDepth + 0.02), new THREE.Euler(0, 0, 0), 32, 16);
        createWallDecal(cyberMuralSvg3, "#fdcb6e", new THREE.Vector3(0, 3.5, halfDepth - 0.02), new THREE.Euler(0, Math.PI, 0), 32, 16);
        createWallDecal(cyberMuralSvg5, "#1e90ff", new THREE.Vector3(halfWidth - 0.02, 3.5, 0), new THREE.Euler(0, -Math.PI/2, 0), 32, 16);
        createWallDecal(cyberMuralSvg4, "#e84393", new THREE.Vector3(-halfWidth + 0.02, 3.5, 0), new THREE.Euler(0, Math.PI/2, 0), 32, 16);

        function createWall(width, height, position, rotation, colorHex) {
            const mat = new THREE.MeshStandardMaterial({
                color: colorHex,
                roughness: 0.7,
                metalness: 0.1
            });
            const geom = new THREE.PlaneGeometry(width, height);
            const wall = new THREE.Mesh(geom, mat);
            wall.position.copy(position);
            wall.rotation.copy(rotation);
            wall.receiveShadow = true;
            walls.add(wall);
            return wall;
        }

        createWall(roomWidth, wallHeight, new THREE.Vector3(0, wallHeight/2, -halfDepth), new THREE.Euler(0, 0, 0), 0xff4757);
        createWall(roomWidth, wallHeight, new THREE.Vector3(0, wallHeight/2, halfDepth), new THREE.Euler(0, Math.PI, 0), 0x1e90ff);
        createWall(roomDepth, wallHeight, new THREE.Vector3(halfWidth, wallHeight/2, 0), new THREE.Euler(0, -Math.PI/2, 0), 0x2ed573);
        createWall(roomDepth, wallHeight, new THREE.Vector3(-halfWidth, wallHeight/2, 0), new THREE.Euler(0, Math.PI/2, 0), 0xffa502);

        const rugGeom = new THREE.PlaneGeometry(12, 12);
        const rugMat = new THREE.MeshStandardMaterial({ color: 0xeccc68, roughness: 1.0 });
        const rug = new THREE.Mesh(rugGeom, rugMat);
        rug.rotation.x = -Math.PI / 2;
        rug.position.y = 0.01;
        rug.receiveShadow = true;
        scene.add(rug);

        const floorGridGroup = new THREE.Group();
        const gridColor = 0x3742fa;
        const gridLineMat = new THREE.LineBasicMaterial({ color: gridColor, transparent: true, opacity: 0.5 });
        
        for (let i = -16; i <= 16; i += 4) {
            const pointsH = [new THREE.Vector3(-18, 0.02, i), new THREE.Vector3(18, 0.02, i)];
            const geomH = new THREE.BufferGeometry().setFromPoints(pointsH);
            const lineH = new THREE.Line(geomH, gridLineMat);
            floorGridGroup.add(lineH);

            const pointsV = [new THREE.Vector3(i, 0.02, -18), new THREE.Vector3(i, 0.02, 18)];
            const geomV = new THREE.BufferGeometry().setFromPoints(pointsV);
            const lineV = new THREE.Line(geomV, gridLineMat);
            floorGridGroup.add(lineV);
        }
        scene.add(floorGridGroup);

        const particleCount = 200;
        const particlesGeom = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        for(let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 38; 
            positions[i+1] = Math.random() * wallHeight; 
            positions[i+2] = (Math.random() - 0.5) * 38; 
        }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        const pCanvas = document.createElement('canvas');
        pCanvas.width = 16;
        pCanvas.height = 16;
        const pCtx = pCanvas.getContext('2d');
        const pGrad = pCtx.createRadialGradient(8, 8, 0, 8, 8, 8);
        pGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
        pGrad.addColorStop(0.4, 'rgba(255, 255, 255, 0.5)');
        pGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        pCtx.fillStyle = pGrad;
        pCtx.fillRect(0, 0, 16, 16);
        const pTex = new THREE.CanvasTexture(pCanvas);
        
        const particlesMat = new THREE.PointsMaterial({
            size: 0.18,
            map: pTex,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const particleSystem = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particleSystem);

        const pillarGeom = new THREE.CylinderGeometry(0.6, 0.6, wallHeight, 32);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });

        function createSpriteTexture(color, text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, 512, 256);

            ctx.font = 'bold 70px "Segoe UI", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const lines = text.split('\n');
            const lineHeight = 80;
            const startY = 128 - ((lines.length - 1) * lineHeight) / 2;

                ctx.lineJoin = 'round';
                ctx.lineWidth = 8;
                ctx.strokeStyle = '#000000';
                ctx.strokeText(line, 256, startY + (index * lineHeight));

                ctx.shadowColor = color;
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#ffffff';
                ctx.fillText(line, 256, startY + (index * lineHeight));
                ctx.shadowBlur = 0; 
            });

            const tex = new THREE.CanvasTexture(canvas);
            tex.generateMipmaps = false; 
            tex.minFilter = THREE.LinearFilter; 
            tex.magFilter = THREE.LinearFilter; 
            return tex;
        }

        function createIconTexture(svgString, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
            gradient.addColorStop(0, color);
            gradient.addColorStop(0.6, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);

            const img = new Image();
            const coloredSvg = svgString.replace('fill="white"', `fill="#ffffff"`);
            const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(coloredSvg);
            
            const texture = new THREE.CanvasTexture(canvas);
            
            img.onload = () => {
                ctx.shadowColor = color;
                ctx.shadowBlur = 30;
                ctx.drawImage(img, 64, 64, 384, 384); 
                texture.needsUpdate = true;
            };
            img.src = svgUrl;

            return texture;
        }

        function createPlaceholderTexture(color, text, type = 'project') {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            if (type === 'main-project') {
                // Sci-fi hologram gradient background
                const gradient = ctx.createRadialGradient(256, 256, 10, 256, 256, 400);
                gradient.addColorStop(0, '#2b2b2b');
                gradient.addColorStop(1, color);
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 512, 512);

                // Grid lines
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 2;
                for (let i = 0; i <= 512; i += 64) {
                    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
                }

                // Tech borders
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 6;
                ctx.strokeRect(15, 15, 482, 482);
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 2;
                ctx.strokeRect(25, 25, 462, 462);

                // Corner accents
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(10, 10, 40, 10); ctx.fillRect(10, 10, 10, 40);
                ctx.fillRect(462, 10, 40, 10); ctx.fillRect(492, 10, 10, 40);
                ctx.fillRect(10, 492, 40, 10); ctx.fillRect(10, 462, 10, 40);
                ctx.fillRect(462, 492, 40, 10); ctx.fillRect(492, 462, 10, 40);

            } else {
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, 512, 512);

                if (type === 'certificate') {
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 15;
                    ctx.strokeRect(20, 20, 472, 472);
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(40, 40, 432, 432);
                } else if (type === 'skill') {
                    ctx.beginPath();
                    ctx.arc(256, 256, 200, 0, 2 * Math.PI);
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = 15;
                    ctx.stroke();
                } else {
                    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                    ctx.lineWidth = 10;
                    ctx.strokeRect(20, 20, 472, 472);
                }
            }

            // Drop shadow for text to make it pop more
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = 3;

            ctx.fillStyle = '#ffffff';
            ctx.font = type === 'skill' ? 'bold 60px Arial' : (type === 'main-project' ? 'bold 50px Arial' : 'bold 40px Arial');
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const lines = text.split('\n');
            const lineHeight = type === 'skill' ? 70 : (type === 'main-project' ? 65 : 50);
            const startY = 256 - ((lines.length - 1) * lineHeight) / 2;

            lines.forEach((line, index) => {
                ctx.fillText(line, 256, startY + (index * lineHeight));
            });

            ctx.shadowColor = 'transparent'; // Reset shadow

            return new THREE.CanvasTexture(canvas);
        }

                    if (INTERSECTED.material && INTERSECTED.material.emissive) INTERSECTED.material.emissive.setHex(0x000000);
                    INTERSECTED = null;
                    hideInfo();
                }
            }
        }

        window.addEventListener('resize', onWindowResize, false);

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();

            // Pulse the floor grid opacity
            gridLineMat.opacity = 0.4 + Math.sin(time * 0.002) * 0.2;

            // Float the dust particles
            const positionsArr = particlesGeom.attributes.position.array;
            for (let i = 0; i < particleCount * 3; i += 3) {
                positionsArr[i+1] += 0.003; 
                positionsArr[i] += Math.sin(time * 0.001 + i) * 0.002; 
                if (positionsArr[i+1] > wallHeight) {
                    positionsArr[i+1] = 0; 
                }
            }
            particlesGeom.attributes.position.needsUpdate = true;

            dynamicObjects.forEach(obj => {
                obj.rotation.y += 0.01;
            });

            // Animate the holographic displays
            floatingDisplays.forEach(display => {
                display.holoGroup.rotation.y -= 0.005; 
                display.ring1.rotation.x += 0.01;
                display.ring1.rotation.y += 0.02;
            display.ring2.rotation.y -= 0.01;
            display.ring2.rotation.z += 0.02;
            
            // Pulse the SVG icon scale with the new larger size
            const scalePulse = 3.5 + Math.sin(time * 0.003 + display.seed) * 0.3;
            display.core.scale.set(scalePulse, scalePulse, 1); 
            
            // Gentle floating up and down bob
            display.group.position.y = 3.5 + Math.sin(time * 0.002 + display.seed) * 0.3;
        });

        if (controls && controls.isLocked === true) {
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= gravity * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const currentSpeed = isRunning ? speed * 2.2 : speed;

                if (moveForward || moveBackward) velocity.z -= direction.z * currentSpeed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * currentSpeed * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                
                controls.getObject().position.y += (velocity.y * delta);

                if (controls.getObject().position.y < 3.5) {
                    velocity.y = 0;
                    controls.getObject().position.y = 3.5;
                    canJump = true;
                }

                const pos = controls.getObject().position;
                const boundaryWidth = halfWidth - 1;
                const boundaryDepth = halfDepth - 1; 
                
                if (pos.x > boundaryWidth) pos.x = boundaryWidth;
                if (pos.x < -boundaryWidth) pos.x = -boundaryWidth;
                if (pos.z > boundaryDepth) pos.z = boundaryDepth;
                if (pos.z < -boundaryDepth) pos.z = -boundaryDepth;

                checkIntersections();
            }

            prevTime = time;

            renderer.render(scene, camera);
        }

        window.onload = function() {
            const loading = document.getElementById('loading');
            loading.style.opacity = '0';
            setTimeout(() => {
                loading.style.display = 'none';
                if(typeof THREE.PointerLockControls !== 'undefined') {
                    initControls();
                } else {
                    console.error("PointerLockControls script failed to load.");
                    document.getElementById('loading').innerText = "Error loading controls.";
                    document.getElementById('loading').style.display = 'block';
                    document.getElementById('loading').style.opacity = '1';
                }
                
                animate();
            }, 500);
        };

    </script>
</body>
</html>
